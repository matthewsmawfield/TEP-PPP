# RTKLIB PPP-static configuration for the LC29H(BS) receiver.
# Optimised for dual-frequency L1+L5 ionosphere-free PPP with precise
# SP3/CLK products.  Uses GPS+Galileo (both have L1+L5) and the IGS14
# antenna calibration file for satellite PCV corrections.

pos1-posmode       =ppp-static # PPP-static
pos1-frequency     =l1+l2+l5   # triple-frequency (receiver has L1+L5)
pos1-soltype       =forward    # forward filter
pos1-elmask        =10         # 10 degree elevation mask
pos1-dynamics      =off        # static receiver
pos1-tidecorr      =on         # solid earth tides
pos1-ionoopt       =dual-freq  # ionosphere-free IF combination (critical!)
pos1-tropopt       =est-ztd    # estimate ZTD residual
pos1-sateph        =precise    # use SP3/CLK precise products
pos1-exclsats      =           # no excluded satellites
pos1-navsys        =5          # GPS(1)+Galileo(4) — both have L1+L5

pos2-armode        =off        # no integer ambiguity resolution (float PPP)
pos2-gloarmode     =off
pos2-arthres       =3
pos2-arlockcnt     =0
pos2-arelmask      =0
pos2-aroutcnt      =5
pos2-arminfix      =10
pos2-slipthres     =1.00       # cycle slip threshold (m) — relaxed for L1/L5
pos2-maxage        =30         # max age of differential (s)
pos2-rejionno      =100        # ionosphere outlier rejection threshold (m)
pos2-niter         =3
pos2-baselen       =0
pos2-basesig       =0

ant1-postype       =rinexhead  # use RINEX header approximate position
ant1-pos1          =0
ant1-pos2          =0
ant1-pos3          =0
ant1-anttype       =           # no antenna type (use default APC)
ant1-antdele       =0          # antenna delta E (m)
ant1-antdeln       =0          # antenna delta N (m)
ant1-antdelu       =0          # antenna delta U (m)

ant2-postype       =llh
ant2-pos1          =0
ant2-pos2          =0
ant2-pos3          =0
ant2-anttype       =
ant2-antdele       =0
ant2-antdeln       =0
ant2-antdelu       =0

misc-timeout       =30000
misc-reconnect     =30000

file-satantfile    =
file-rcvantfile    =
