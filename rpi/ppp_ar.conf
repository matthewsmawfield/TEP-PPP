# RTKLIB 2.4.2 PPP-AR configuration for Waveshare LC29H(BS) (L1/L5)
# Modified ppp_ar.c to use L1-L5 wide-lane and L1+L5 narrow-lane
# Uses CNES GRG integer recovery clocks with embedded WL biases

pos1-posmode       =ppp-static
# RTKLIB 2.4.2 has no "l1+l5" frequency option (FRQOPT is
# "1:l1,2:l1+l2,3:l1+l2+l5,...").  Using "l1+l5" was invalid and caused
# the custom rnx2rtkp_pppar build to reject the config and fall back to
# SPP (Q=0), disabling PPP-AR entirely.  Use "l1+l2+l5" (nf=3) instead:
# the receiver has no L2, so RTKLIB simply skips missing L2 observations,
# and the custom AR logic uses L1-L5 wide-lane and L1+L5 narrow-lane.
pos1-frequency     =l1+l2+l5
pos1-soltype       =forward
pos1-elmask        =10
pos1-dynamics      =off
pos1-tidecorr      =on
pos1-ionoopt       =dual-freq
pos1-tropopt       =est-ztd
# pos1-sateph=precise uses the SP3/CLK files passed on the command line.
# The earlier "precise+brdc" value is a demo5-only extension not recognised
# by the custom rnx2rtkp_pppar build (RTKLIB 2.4.2), which silently rejects
# the entire config and falls back to SPP (Q=5) — disabling PPP-AR entirely.
# Testing on the LC29H capture (DOY 247) confirms that "precise" produces
# Q=6 (PPP float) and Q=1 (fixed) epochs; the earlier Q=0 report was a
# different issue that has since been resolved.
pos1-sateph        =precise
pos1-navsys        =9

pos2-armode        =ppp-ar
pos2-arthres       =2.0
pos2-slipthres     =0.50
pos2-rejionno      =100
pos2-niter         =3
